[build]
  command = "npm run build"
  # Where the client bundle lands. This is not optional and not inferred:
  # without it Netlify publishes the repository root, every /assets/* request
  # misses, and the SSR catch-all answers each one with the app's HTML — which
  # surfaces as a page that 404s all its own scripts and refuses its stylesheet
  # for having a text/html MIME type.
  #
  # The server half is emitted separately by @netlify/vite-plugin-react-router,
  # into .netlify/v1/functions/, which Netlify picks up on its own.
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # The sweep imports app/lib/*.server.ts directly rather than duplicating the
  # checking logic. esbuild follows those imports at bundle time.
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"
