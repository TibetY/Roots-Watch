name: Stock watch

# Polls the watched Roots product every 5 minutes and sends a push
# notification when a wanted size comes back in stock. Runs here rather than
# on a laptop so it keeps checking overnight and while the machine is closed.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ROOTS_WATCH_WEBHOOK        - JSON POST target (e.g. https://ntfy.sh for ntfy)
#   ROOTS_WATCH_WEBHOOK_TOPIC  - ntfy.sh topic, if the webhook is ntfy's bare origin
# Optional repository variables (same settings page, Variables tab):
#   ROOTS_WATCH_URL      - override the product page (defaults to the shirt)
#   ROOTS_WATCH_SIZES    - override the sizes (defaults to 3,5)
#   ROOTS_WATCH_INTERVAL - minutes between checks (defaults to 5)
#
# Why one long job instead of one job per check:
#
# `schedule` is best-effort, and for this repo it was missing roughly nine out
# of ten ticks — a 10-minute cron delivered runs a median of ~1.6 hours apart,
# worst case 3.6 hours, at scattered minutes that ignored the cron entirely.
# Asking for */5 makes that worse, not better: high-frequency schedules are the
# first thing GitHub sheds under load. So cron no longer sets the cadence. It
# only *starts* a session, and the watcher paces its own 5-minute checks from
# inside a single job. A dropped tick now costs one session start, not one
# check.
#
# The session runs 55 minutes and there are two starts an hour, so a dropped
# tick is usually covered by the next one. `concurrency` keeps at most one
# session running with at most one queued behind it, and the queued run starts
# the moment the running one ends — which is what makes the coverage roughly
# continuous rather than 55-minutes-on, 5-minutes-off.
#
# Still true, and still the first thing to check if alerts go quiet for weeks:
# GitHub stops scheduling a workflow entirely after 60 days with no push to the
# repository.

on:
  schedule:
    - cron: '3,33 * * * *'
  workflow_dispatch:

# Never let two sessions run at once — they'd double the request rate and race
# on the shared alert state. `cancel-in-progress: false` means a new start
# waits for the running session instead of killing it.
concurrency:
  group: stock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # The watcher stops itself at 55 minutes; this is only a backstop for a
    # wedged run, and has to stay above it or it would cut sessions short.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No `npm ci` step: the watcher has no runtime dependencies. vitest is
      # the only package in this repo and it is needed for tests, not for this.

      # Each run gets a fresh machine, so the "have we already alerted about
      # this restock" state has to be carried between runs. The key is unique
      # per run (caches are immutable) and restore-keys picks up the newest
      # previous one.
      - name: Restore watch state
        uses: actions/cache@v4
        with:
          path: .watch-state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-

      - name: Check stock
        env:
          ROOTS_WATCH_WEBHOOK: ${{ secrets.ROOTS_WATCH_WEBHOOK }}
          ROOTS_WATCH_WEBHOOK_TOPIC: ${{ secrets.ROOTS_WATCH_WEBHOOK_TOPIC }}
          ROOTS_WATCH_URL: ${{ vars.ROOTS_WATCH_URL }}
          ROOTS_WATCH_SIZES: ${{ vars.ROOTS_WATCH_SIZES }}
          # An unset repository variable arrives as '', which is falsy here, so
          # this is the 5-minute default unless someone sets the variable.
          ROOTS_WATCH_INTERVAL: ${{ vars.ROOTS_WATCH_INTERVAL || '5' }}
        run: |
          set +e
          node src/index.mjs --watch --max-minutes 55
          code=$?
          set -e
          # 10 (in stock) is a successful check, not a failed job — the alert
          # has already gone out by this point. 20 means the last check of the
          # session couldn't read the page; the script alerts on its own once
          # that has been true for two hours, so here it's only a warning.
          case "$code" in
            0|10) exit 0 ;;
            20) echo "::warning::Could not determine availability on the last check of this session" ; exit 0 ;;
            *) exit "$code" ;;
          esac
